<!doctype html><html><head><meta charset="utf-8">
<!-- Source of docs/banner.png (README header + GitHub social preview, 1280x640). Render it at a 1280x640 viewport, DPR 1, after `npm run screenshots` has refreshed the city shots it uses. -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1280px;height:640px;background:#F6F2EA;font-family:Inter,sans-serif;color:#0E2438;position:relative;overflow:hidden}
.flag{position:absolute;top:0;left:0;right:0;height:8px;background:linear-gradient(90deg,#006aa7,#fecc00,#006aa7)}
.left{position:absolute;left:72px;top:0;bottom:0;width:520px;display:flex;flex-direction:column;justify-content:center}
.mark{width:72px;height:72px;margin-bottom:28px}
h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:108px;line-height:.9;color:#7C3228;letter-spacing:-1px}
.tag{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:42px;line-height:1.1;margin-top:18px}
.sub{font-size:21px;line-height:1.5;color:#4A5259;margin-top:22px;max-width:460px}
.chips{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap}
.chip{font-size:16px;font-weight:600;padding:7px 14px;border-radius:999px;background:#7C32281a;color:#7C3228}
.chip.g{background:#C8A24A2e;color:#7a5d17}
.shots{position:absolute;right:-40px;top:70px;width:700px;height:520px}
.shot{position:absolute;border-radius:18px;box-shadow:0 18px 50px rgba(14,36,56,.28);border:4px solid #fff;object-fit:cover}
.s1{width:430px;height:322px;right:330px;top:170px;transform:rotate(-4deg)}
.s2{width:500px;height:374px;right:60px;top:10px;transform:rotate(3deg)}
.s3{width:300px;height:224px;right:40px;top:300px;transform:rotate(-2deg)}
</style></head><body>
<div class="flag"></div>
<div class="left">
<svg class="mark" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="#7C3228"/><path d="M8 20c1-6 4-9 8-9s7 3 8 9" stroke="#F6F2EA" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="16" cy="11" r="2.4" fill="#C8A24A"/></svg>
<h1>Swedish</h1>
<div class="tag">Learn Swedish. Build Stockholm.</div>
<div class="sub">Five-minute lessons from SFI A to SVA grund, and a city that grows from a first settlement on the island to a city among the stars.</div>
<div class="chips"><span class="chip">400 lessons</span><span class="chip">5 400 words</span><span class="chip g">10 eras</span><span class="chip g">offline PWA</span></div>
</div>
<div class="shots">
<img class="shot s1" src="screenshots/city-medieval.png">
<img class="shot s2" src="screenshots/city-empire.png">
<img class="shot s3" src="screenshots/city-stellar.png">
</div>
</body></html>
